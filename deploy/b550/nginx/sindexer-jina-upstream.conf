upstream sindexer_jina {
    least_conn;
    server 127.0.0.1:1236 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:1237 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 127.0.0.1:1238;

    location / {
        proxy_pass http://sindexer_jina;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
